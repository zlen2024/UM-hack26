# fly.toml app configuration file generated for um-hack26 on 2026-04-18T16:51:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'um-hack26-lpgdmq'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep exactly ONE machine running. SQLite is a single local file on the
  # mounted volume, so the app must not be horizontally scaled. Also run
  # `fly scale count 1` so only one machine (and one volume) exists.
  min_machines_running = 1
  processes = ['app']

# Persistent volume so the SQLite database survives restarts/redeploys.
# Create it once before deploying:  fly volumes create um_crm_data --region sin --size 1
[mounts]
  source = 'um_crm_data'
  destination = '/data'

[env]
  # Store the SQLite file on the mounted volume (absolute path -> 4 slashes).
  DATABASE_URL = 'sqlite:////data/um_crm.db'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
